name: Update data
on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I scripts/fetch_data.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/prices.json; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git commit -m "chore: update price data"
          git push
          # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start the Pages deploy explicitly.
          gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
